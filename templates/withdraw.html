<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Withdraw Money | WEnion Bank</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='withdraw.css') }}">
</head>

<body>

    <!-- Animated Background -->
    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>
    <div class="background-shape shape-three"></div>

    <main class="withdraw-container">

        <!-- Header -->
        <header class="withdraw-header">

            <div class="bank-icon">
                <span>₹</span>
            </div>

            <p class="eyebrow">WENION BANK OF INDIA</p>

            <h1>Withdraw Money</h1>

            <p class="subtitle">
                Access your funds whenever you need them.
            </p>

        </header>

        <!-- Withdrawal Form -->
        <form method="post" class="withdraw-form">

            <label for="amount">Enter Withdrawal Amount</label>

            <div class="amount-wrapper">
                <span class="currency-symbol">₹</span>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="0.00"
                    min="0.01"
                    step="0.01"
                    inputmode="decimal"
                    required
                >
            </div>

            <p class="input-hint">
                Enter the amount you wish to withdraw.
            </p>

            <button type="submit" class="withdraw-button">
                <span>Withdraw Money</span>
                <span class="button-arrow">→</span>
            </button>

        </form>

        <!-- Information -->
        <div class="security-note">
            <span class="security-icon">✓</span>
            <p>Review your withdrawal amount before submitting.</p>
        </div>

        <footer class="withdraw-footer">
            © 2026 WEnion Bank of India
        </footer>

    </main>

</body>
</html>
